}

let AC = null, master = null, noiseBuf = null;
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.5; master.connect(AC.destination);
    noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { AC = null; }
}
function env(g, t, peak, dur) { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); }
function noise(t, dur, type, freq, q, peak) {
  const n = AC.createBufferSource(); n.buffer = noiseBuf;
  const f = AC.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
  const g = AC.createGain(); env(g, t, peak, dur);
  n.connect(f).connect(g).connect(master); n.start(t); n.stop(t + dur + 0.05);
  return f;
}
function tone(t, dur, type, f0, f1, peak) {
  const o = AC.createOscillator(); o.type = type;
  o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  const g = AC.createGain(); env(g, t, peak, dur);
  o.connect(g).connect(master); o.start(t); o.stop(t + dur + 0.05);
}

// =====================================================================
//  İskelet
// =====================================================================
function skel(p, dir, spin, sword) {
  const j = {};
  const sl = Math.sin(p.lean), cl = Math.cos(p.lean);
  j.hip = [0, 0];
  j.neck = [sl * dir * LEN.torso * S, -cl * LEN.torso * S];
  const ha = p.lean + p.head, hl = (LEN.neck + LEN.head) * S;
  j.head = [j.neck[0] + Math.sin(ha) * dir * hl, j.neck[1] - Math.cos(ha) * hl];
  j.sh = [sl * dir * (LEN.torso - 5) * S, -cl * (LEN.torso - 5) * S];
  const seg = (o, a, l) => [o[0] + Math.sin(a) * dir * l * S, o[1] + Math.cos(a) * l * S];
  j.fe = seg(j.sh, p.fua, LEN.ua); j.fh = seg(j.fe, p.ffa, LEN.fa);
  j.be = seg(j.sh, p.bua, LEN.ua); j.bh = seg(j.be, p.bfa, LEN.fa);
  j.fk = seg(j.hip, p.fth, LEN.th); j.ff = seg(j.fk, p.fsh, LEN.sh);
  j.bk = seg(j.hip, p.bth, LEN.th); j.bf = seg(j.bk, p.bsh, LEN.sh);
  if (sword) j.tip = seg(j.fh, p.ffa, SWORD);
  const rotate = a => { const c = Math.cos(a), s = Math.sin(a); for (const k in j) { const [x, y] = j[k]; j[k] = [x * c - y * s, x * s + y * c]; } };
  if (p.rot) rotate(p.rot * dir);
  let my = -1e9;
  for (const k in j) { if (k === 'tip') continue; const y = j[k][1] + (k === 'head' ? LEN.head * S : 0); if (y > my) my = y; }
  if (spin) rotate(spin * dir);
  j._b = my;
  return j;
}
function worldJoints(f) {
  const j = skel(f.pose, f.dir, f.spin, f.ch.sword), o = {};
  for (const k in j) if (k !== '_b') o[k] = [f.x + j[k][0], f.y - j._b + j[k][1]];
  return o;
}
// bir noktanın vücut çizgisine (baş–ayaklar) uzaklığı
function bodyDist(px, py, f) {
  const a = f.j.head, b = [(f.j.ff[0] + f.j.bf[0]) / 2, (f.j.ff[1] + f.j.bf[1]) / 2];
  const dx = b[0] - a[0], dy = b[1] - a[1], L = dx * dx + dy * dy || 1;
  const t = Math.max(0, Math.min(1, ((px - a[0]) * dx + (py - a[1]) * dy) / L));
  return Math.hypot(px - (a[0] + dx * t), py - (a[1] + dy * t));
}

// =====================================================================
//  Efektler
// =====================================================================
function sparks(pt, color, n, power) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = (400 + Math.random() * 1100) * power;
    particles.push({ type: 'spark', x: pt[0], y: pt[1], vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: .25 + Math.random() * .25, max: .5, color, w: 2 + Math.random() * 3 });

}

function separate() {
  const busy = f => f.state === 'air' || f.state === 'rush' || f.state === 'special' || f.held || f.state === 'dash';
  if (busy(P) || busy(E)) return;

function aiControl(f, dt) {

function buttons() {

cv.addEventListener('pointerdown', e => {

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = '#f6f2ff'; ctx.fillRect(0, 0, W, H);
    ctx.setTransform(DPR * s, 0, 0, DPR * s, DPR * tx, DPR * groundScreen);
    drawBursts('#0b0a14');

    drawHUD();

  }
  drawBackground(s, ox, groundScreen);
  ctx.setTransform(DPR * s, 0, 0, DPR * s, DPR * tx, DPR * groundScreen);
  if (focus && focus.state === 'special') {
    const a = focus.t < .6 ? Math.min(.5, focus.t) : Math.max(0, .3 - (focus.t - 1.2) * 2);
    ctx.save(); ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.fillStyle = `rgba(4,3,10,${a})`; ctx.fillRect(0, 0, W, H); ctx.restore();
  }
  drawShots();
  drawSpecials();
  for (const a of afters) drawBody(a.j, a.color, a.color, (a.life / a.max) * .45, null, a.sword);
  const front = (P.state === 'atk' || P.state === 'special' || P.state === 'rush' || P.state === 'cast') ? P : E;
  for (const f of [other(front), front]) drawFighter(f);
  drawAim();
  drawParticles();
  drawBursts('#ffffff');
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (vignette) ctx.drawImage(vignette, 0, 0);
  if (flashScreen > 0) { ctx.fillStyle = `rgba(255,255,255,${flashScreen * .5})`; ctx.fillRect(0, 0, cv.width, cv.height); }
  drawHUD();
}

// --- karakter seçimi
function selectLayout() {
  const portrait = H > W;
  const u = Math.min(W, H);
  const cw = portrait ? Math.min(W * .86, 380) : Math.min(W * .42, 390);
  const ch = portrait ? Math.min(H * .3, 250) : Math.min(H * .56, 260);
  const gap = Math.max(12, u * .035);
  let cards, y0;
  if (portrait) { const x = (W - cw) / 2; y0 = H * .18; cards = [{ id: 'kai', x, y: y0, w: cw, h: ch }, { id: 'zen', x, y: y0 + ch + gap, w: cw, h: ch }]; }
  else { y0 = Math.max(H * .22, 70); cards = [{ id: 'kai', x: W / 2 - gap / 2 - cw, y: y0, w: cw, h: ch }, { id: 'zen', x: W / 2 + gap / 2, y: y0, w: cw, h: ch }]; }
  const lastC = cards[cards.length - 1];
  const dh = Math.max(32, Math.min(42, u * .085)), dw = Math.min(130, W * .2), dy = Math.min(H - dh - 8 - safeB, lastC.y + lastC.h + gap);
  const keysD = ['kolay', 'normal', 'zor'];
  const totalW = dw * 3 + 10 * 2;
  const diffs = keysD.map((id, i) => ({ id, x: W / 2 - totalW / 2 + i * (dw + 10), y: dy, w: dw, h: dh }));
  return { cards, diffs, titleY: portrait ? H * .09 : Math.max(30, H * .09) };
}
function roundRect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function fitFont(txt, maxW, size) { ctx.font = `${size}px ${FONT}`; while (size > 9 && ctx.measureText(txt).width > maxW) { size -= 1; ctx.font = `${size}px ${FONT}`; } return size; }
function drawSelect() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = 'rgba(6,4,14,.55)'; ctx.fillRect(0, 0, W, H);
  const L = selectLayout(), u = Math.min(W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  fitFont('ÇUBUK DÖVÜŞ', W * .8, Math.max(24, u * .09));
  ctx.lineWidth = 6; ctx.strokeStyle = '#0b0a14'; ctx.strokeText('ÇUBUK DÖVÜŞ', W / 2, L.titleY);
  ctx.fillStyle = '#ffffff'; ctx.fillText('ÇUBUK DÖVÜŞ', W / 2, L.titleY);
  ctx.font = `${Math.max(11, u * .032)}px ${FONT}`; ctx.fillStyle = 'rgba(242,240,255,.7)';
  ctx.fillText('Dövüşçünü seç · her yetenek atlatılabilir', W / 2, L.titleY + Math.max(22, u * .065));
  const now = performance.now();
  for (const c of L.cards) {
    const C = CHARS[c.id];
    roundRect(c.x, c.y, c.w, c.h, 14);
    ctx.fillStyle = 'rgba(16,10,32,.88)'; ctx.fill();
    ctx.lineWidth = 2.5; ctx.strokeStyle = C.color; ctx.stroke();
    const fs = c.h * .62 / 260;
    const pose = Object.assign({}, POSE.idle);
    const b = Math.sin(now / 260 + (c.id === 'zen' ? 1 : 0)) * 4 * D; pose.fua += b; pose.bua -= b;
    const j = skel(pose, 1, 0, C.sword);
    ctx.save();
    ctx.translate(c.x + c.w * .19, c.y + c.h * .86);
    ctx.scale(fs, fs);
    const jj = {}; for (const k in j) if (k !== '_b') jj[k] = [j[k][0], j[k][1] - j._b];
    drawBody(jj, C.color, C.core, 1, null, C.sword);
    ctx.restore();
    const tx = c.x + c.w * .38, tw = c.w * .58;
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    fitFont(C.name, tw, c.h * .15); ctx.fillStyle = C.color; ctx.fillText(C.name, tx, c.y + c.h * .2);
    fitFont(C.title, tw, c.h * .07); ctx.fillStyle = '#ffffff'; ctx.fillText(C.title, tx, c.y + c.h * .31);
    fitFont(C.style, tw, c.h * .058); ctx.fillStyle = 'rgba(255,231,106,.9)'; ctx.fillText(C.style, tx, c.y + c.h * .41);
    ctx.fillStyle = 'rgba(242,240,255,.82)';
    let dsz = c.h * .058; for (const d of C.desc) dsz = Math.min(dsz, fitFont(d, tw, c.h * .058));
    ctx.font = `${dsz}px ${FONT}`;
    C.desc.forEach((d, i) => ctx.fillText(d, tx, c.y + c.h * (.55 + i * .115)));
  }
  for (const d of L.diffs) {
    const on = d.id === diffKey;
    roundRect(d.x, d.y, d.w, d.h, 10);
    ctx.fillStyle = on ? 'rgba(255,231,106,.25)' : 'rgba(255,255,255,.06)'; ctx.fill();
    ctx.strokeStyle = on ? '#ffe76a' : 'rgba(255,255,255,.25)'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = on ? '#ffe76a' : 'rgba(255,255,255,.7)'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    fitFont(DIFF[d.id].name, d.w * .8, d.h * .42); ctx.fillText(DIFF[d.id].name, d.x + d.w / 2, d.y + d.h / 2 + 1);
  }

}
function overButtons() {
  const bw = Math.min(220, W * .34), bh = Math.max(42, Math.min(56, H * .11)), y = H * .72;
  return [{ id: 'again', x: W / 2 - bw - 8, y, w: bw, h: bh, label: 'TEKRAR' }, { id: 'select', x: W / 2 + 8, y, w: bw, h: bh, label: 'KARAKTER SEÇ' }];
}

function bar(x, y, w, h, v, shown, color, flip) {
  ctx.fillStyle = 'rgba(10,8,20,.75)'; ctx.fillRect(x - 2, y - 2, w + 4, h + 4);
  const fill = (frac, c) => { ctx.fillStyle = c; const ww = w * Math.max(0, Math.min(1, frac)); ctx.fillRect(flip ? x + w - ww : x, y, ww, h); };
  fill(shown, '#ffffff'); fill(v, color);
}
function drawButton(bt, label, fill, stroke, textC, press, frac) {
  const r = bt.r * (1 - press * .12);
  ctx.fillStyle = fill; ctx.beginPath(); ctx.arc(bt.x, bt.y, r, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.22)'; ctx.lineWidth = 3; ctx.stroke();
  if (frac !== undefined) {
    ctx.strokeStyle = stroke; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(bt.x, bt.y, r, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * Math.max(0, Math.min(1, frac))); ctx.stroke();
  } else { ctx.strokeStyle = stroke; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(bt.x, bt.y, r, 0, Math.PI * 2); ctx.stroke(); }
  ctx.fillStyle = textC; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  fitFont(label, r * 1.6, r * .4);
  ctx.fillText(label, bt.x, bt.y + 1);
  ctx.textBaseline = 'alphabetic';
}
function hexA(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }
function drawHUD() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const u = Math.min(W, H);
  const pad = Math.max(14, safeL + 10), padR = Math.max(14, safeR + 10);
  const bw = Math.min(W * .36, 420), bh = Math.max(12, u * .035), top = Math.max(12, u * .04);
  ctx.textBaseline = 'alphabetic';
  bar(pad, top, bw, bh, P.hp / P.maxhp, P.hpShown / P.maxhp, P.color, false);
  bar(W - padR - bw, top, bw, bh, E.hp / E.maxhp, E.hpShown / E.maxhp, E.color, true);
  const eh = Math.max(5, bh * .4);
  for (const [f, x, flip] of [[P, pad, false], [E, W - padR - bw * .6, true]]) {
    const full = f.energy >= 100;
    ctx.fillStyle = 'rgba(10,8,20,.75)'; ctx.fillRect(x - 1, top + bh + 7, bw * .6 + 2, eh + 2);
    const ww = bw * .6 * f.energy / 100;
    ctx.fillStyle = full ? (Math.floor(performance.now() / 120) % 2 ? '#ffe76a' : '#ffffff') : '#ffe76a';
    ctx.fillRect(flip ? x + bw * .6 - ww : x, top + bh + 8, ww, eh);
  }
  const fs = Math.max(13, u * .036);
  ctx.font = `${fs}px ${FONT}`; ctx.fillStyle = '#f2f0ff';
  ctx.textAlign = 'left'; ctx.fillText(P.name + '  (SEN)', pad, top + bh + eh + fs + 12);
  ctx.textAlign = 'right'; ctx.fillText('YZ ' + DIFF[diffKey].name + '  ' + E.name, W - padR, top + bh + eh + fs + 12);
  ctx.textAlign = 'center'; ctx.font = `${fs * .9}px ${FONT}`; ctx.fillStyle = 'rgba(242,240,255,.7)';
  ctx.fillText(wins[0] + ' – ' + wins[1], W / 2, top + bh * .85);

  const b = buttons();
  const showControls = usedTouch || !matchMedia('(pointer: fine)').matches;
  if (showControls) {
    let stick = null; for (const t of touches.values()) if (t.kind === 'stick') stick = t;
    const home = stickHome(), sc = stick ? [stick.x0, stick.y0] : [home.x, home.y];
    const R = Math.max(46, u * .12);
    ctx.globalAlpha = stick ? .5 : .22; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(sc[0], sc[1], R, 0, Math.PI * 2); ctx.stroke();
    const kx = stick ? sc[0] + Math.max(-R, Math.min(R, stick.x - stick.x0)) : sc[0];
    const ky = stick ? sc[1] + Math.max(-R, Math.min(R, stick.y - stick.y0)) : sc[1];
    ctx.fillStyle = '#ffffff'; ctx.globalAlpha = stick ? .6 : .3;
    ctx.beginPath(); ctx.arc(kx, ky, R * .42, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
    const c = P.color;
    // dövüşçülerin ekran konumu (kalça ve baş); butonun arkasındaysa butonu saydamlaştır
    const sc2 = cam.s, gs = H * .44 - cam.y * sc2, toS = q => [W / 2 + (q[0] - cam.x) * sc2, gs + q[1] * sc2];
    const pts = []; for (const f of [P, E]) for (const k of ['head', 'neck', 'hip', 'fk', 'bk']) pts.push(toS(f.j[k]));
    const covered = bt => pts.some(q => Math.hypot(q[0] - bt.x, q[1] - bt.y) < bt.r * 1.15);
    const btnAlpha = bt => covered(bt) ? .4 : 1;
    ctx.globalAlpha = btnAlpha(b.atk);
    drawButton(b.atk, 'VUR', hexA(c, .22), c, '#ffffff', pressAnim.atk);
    for (const slot of ['y1', 'y2']) {
      const K = SK[P.ch[slot]], fr = 1 - Math.max(0, P.cd[slot]) / K.cd, ready = fr >= 1;
      ctx.globalAlpha = btnAlpha(b[slot]);
      drawButton(b[slot], K.name, ready ? hexA(c, .3) : 'rgba(255,255,255,.06)', c, ready ? '#ffffff' : 'rgba(255,255,255,.45)', pressAnim[slot], fr);
    }
    const full = P.energy >= 100;
    ctx.globalAlpha = btnAlpha(b.sp);
    drawButton(b.sp, 'ÖZEL', full ? 'rgba(255,231,106,.38)' : 'rgba(255,255,255,.06)', '#ffe76a', full ? '#ffe76a' : 'rgba(255,255,255,.5)', pressAnim.sp, P.energy / 100);
    ctx.globalAlpha = 1;
  }

  if (hintT > 0) {
    const a = Math.min(1, hintT / 1.5);
    ctx.globalAlpha = a; ctx.fillStyle = '#ffffff'; ctx.font = `${Math.max(11, u * .029)}px ${FONT}`;
    if (showControls) {
      const home = stickHome();
      ctx.textAlign = 'left';
      ctx.fillText('◀ ▶ sürükle: koş  ·  ▲ yukarı: zıpla (havada: çift zıpla)', Math.max(pad, home.x - 60), home.y - Math.max(46, u * .12) - 16);
      ctx.textAlign = 'right';
      const hy = b.sp.y - b.sp.r - 12, lh = Math.max(14, u * .036);
      ctx.fillText('Sağda kaydır: KAÇ (başındaki 2 nokta = kaçış hakkı)', W - padR, hy - lh * 2);
      ctx.fillText('Yeteneğin içinden kaçarak geç: MÜKEMMEL', W - padR, hy - lh);
      ctx.fillText('Yetenek: dokun = otomatik nişan · basılı tut + sürükle = nişan al', W - padR, hy);
    } else {
      ctx.textAlign = 'center';
      ctx.fillText('A/D koş · W zıpla (2x) · K/Boşluk kaç · J vur · U, I yetenek · L özel', W / 2, H - Math.max(18, safeB + 14));
    }
    ctx.globalAlpha = 1;
  }

  if (intro > 0) {
    const txt = intro > .5 ? 'HAZIR' : 'DÖVÜŞ!';
    const k = intro > .5 ? 1 : 1 + (0.5 - intro) * 1.2;
    drawBig(txt, '#ffffff', u * .16 * k, Math.min(1, intro * 3));
  }
  for (const t of texts) {
    const p = t.t / t.dur, pop = p < .12 ? .6 + p / .12 * .5 : 1.1 - Math.min(.1, (p - .12));
    drawBig(t.txt, t.color, u * .13 * t.size * pop, p > .75 ? (1 - p) / .25 : 1, t.txt === 'K.O.' ? 0 : -u * .12);
  }
  if (roundOver && koTimer > 2.2) {
    ctx.fillStyle = 'rgba(6,4,14,.6)'; ctx.fillRect(0, 0, W, H);
    drawBig(winner === P ? 'KAZANDIN!' : 'KAYBETTİN', winner === P ? '#ffe76a' : '#ffffff', u * .11, 1, -u * .2);
    const st = P.stats, acc = st.casts ? Math.round(st.hits / st.casts * 100) : 0;
    const lines = [['Yetenek isabeti', `${st.hits}/${st.casts}  (%${acc})`], ['Mükemmel kaçış', String(st.perfect)], ['Verilen hasar', String(Math.round(st.dmg))]];
    const ly = H * .42, lh = Math.max(20, u * .06), cw = Math.min(360, W * .6);
    ctx.font = `${Math.max(13, u * .04)}px ${FONT}`;
    lines.forEach(([k, v], i) => {
      ctx.textAlign = 'left'; ctx.fillStyle = 'rgba(242,240,255,.75)'; ctx.fillText(k, W / 2 - cw / 2, ly + i * lh);
      ctx.textAlign = 'right'; ctx.fillStyle = i === 1 ? '#ffe76a' : '#ffffff'; ctx.fillText(v, W / 2 + cw / 2, ly + i * lh);
    });
    for (const bt of overButtons()) {
      roundRect(bt.x, bt.y, bt.w, bt.h, 12);
      ctx.fillStyle = bt.id === 'again' ? hexA(P.color, .3) : 'rgba(255,255,255,.08)'; ctx.fill();
      ctx.strokeStyle = bt.id === 'again' ? P.color : 'rgba(255,255,255,.5)'; ctx.lineWidth = 2.5; ctx.stroke();
      ctx.fillStyle = '#ffffff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      fitFont(bt.label, bt.w * .85, bt.h * .38); ctx.fillText(bt.label, bt.x + bt.w / 2, bt.y + bt.h / 2 + 1);
      ctx.textBaseline = 'alphabetic';
    }
  }
  if (H > W * 1.05) {
    ctx.fillStyle = 'rgba(255,231,106,.95)'; ctx.textAlign = 'center'; ctx.font = `${Math.max(13, W * .04)}px ${FONT}`;
    ctx.fillText('⟳ En iyi deneyim için telefonu yan çevir', W / 2, H * .2);
  }
}
function drawBig(txt, color, size, alpha, dy = 0) {
  ctx.globalAlpha = Math.max(0, Math.min(1, alpha)); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = `${size}px ${FONT}`;
  ctx.lineWidth = size * .12; ctx.strokeStyle = '#0b0a14'; ctx.strokeText(txt, W / 2, H * .42 + dy);
  ctx.fillStyle = color; ctx.fillText(txt, W / 2, H * .42 + dy);
  ctx.globalAlpha = 1; ctx.textBaseline = 'alphabetic';
}

for (const f of [P, E]) f.j = worldJoints(f);
window.__game = { get P() { return P; }, get E() { return E; }, get mode() { return mode; }, get shots() { return shots; }, startFight, input, setDiff(d) { diffKey = d; } };
requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });
})();
</script>
